<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Admin - Pojok Kuliner Adonat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Mesin Supabase untuk Upload File -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- SISTEM KEAMANAN LOGIN ADMIN (USERNAME + PASSWORD) -->
  <script>
    // Ganti Username dan Password rahasia di sini
    const USERNAME_ADMIN = "hafidut";
    const PASSWORD_ADMIN = "Hafidut123#"; 

    // Cek apakah admin sudah login sebelumnya di browser ini
    if (sessionStorage.getItem("admin_logged_in") !== "true") {
      
      // 1. Todong Username dulu
      let inputUser = prompt("👤 Masukkan USERNAME untuk masuk ke Dashboard:");
      
      if (inputUser === USERNAME_ADMIN) {
        // 2. Kalau Username bener, baru todong Password
        let inputPass = prompt("🔒 Masukkan PASSWORD Admin:");
        
        if (inputPass === PASSWORD_ADMIN) {
          // Kalau dua-duanya bener, izinkan masuk!
          sessionStorage.setItem("admin_logged_in", "true");
        } else {
          alert("❌ PASSWORD Salah! Akses ditolak.");
          window.location.href = "../index.html"; // Tendang ke halaman depan
        }
      } else {
        alert("❌ USERNAME Tidak Dikenal! Akses ditolak.");
        window.location.href = "../index.html"; // Tendang ke halaman depan
      }
      
    }
  </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-8">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900">🍩 Pusat Kendali Adonat</h1>
        <p class="text-sm text-slate-500 mt-1">Kelola konten landing page secara langsung (Live API Vercel)</p>
      </div>
      <div>
        <span class="inline-flex items-center gap-1.5 bg-emerald-100 text-emerald-800 px-3 py-1.5 rounded-full text-xs font-semibold">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Backend Online
        </span>
      </div>
    </div>

    <!-- ROW 1: PENGATURAN UMUM -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Pengaturan Nomor WA -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-1 flex items-center gap-2"><span>📱</span> Nomor WhatsApp Pesanan</h2>
        <form id="formWa" class="flex gap-3 mt-4">
          <input type="text" id="noWa" placeholder="6281234567890" required class="flex-1 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-500">
          <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition">Simpan</button>
        </form>
      </div>

      <!-- Pengaturan Info Pengiriman -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-1 flex items-center gap-2"><span>🛵</span> Info Pengiriman</h2>
        <form id="formPengiriman" class="flex flex-col gap-3 mt-4">
          <textarea id="teksPengiriman" rows="2" required class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-amber-500 resize-none"></textarea>
          <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition">Simpan Info</button>
        </form>
      </div>
    </div>

    <!-- ROW 2: KELOLA KONTEN ETALASE -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      
      <!-- KELOLA TOPPING FAVORIT -->
      <div class="space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative">
          <!-- Loading Overlay buat animasi upload -->
          <div id="loadingTopping" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center rounded-2xl">
             <div class="w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
             <p class="text-sm font-bold text-amber-700 mt-3">Sedang Mengupload Foto...</p>
          </div>

          <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2"><span>✨</span> Tambah Topping Favorit</h2>
          <form id="formTopping" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Topping</label>
              <input type="text" id="namaTopping" placeholder="Contoh: Keju Lumer" required class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Ikon Emoji</label>
              <input type="text" id="ikonEmoji" placeholder="Contoh: 🧀" required class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-amber-500">
            </div>
            <!-- INI BAGIAN YANG BERUBAH JADI UPLOAD FILE -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Upload Foto (Dari Galeri/Kamera)</label>
              <input type="file" id="fileFoto" accept="image/*" required class="w-full border border-slate-300 rounded-xl p-2 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer">
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-sm transition mt-2">
              Simpan & Upload Topping
            </button>
          </form>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3">Daftar Topping Aktif</h3>
          <div id="listTopping" class="divide-y divide-slate-100"></div>
        </div>
      </div>

      <!-- KELOLA PAKET DONAT & PROMO (Tetap Sama) -->
      <div class="space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2"><span>📦</span> Tambah Paket Donat</h2>
          <form id="formPaket" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Paket</label>
              <input type="text" id="namaPaket" required class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Deskripsi Singkat</label>
              <input type="text" id="deskripsiPaket" required class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-amber-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Harga (Rp)</label>
                <input type="number" id="hargaPaket" required class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-amber-500">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Detail Pcs/Isi</label>
                <input type="text" id="pcsPaket" required class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-amber-500">
              </div>
            </div>
            <div class="flex items-center gap-2 pt-1">
              <input type="checkbox" id="isPromo" class="w-4 h-4 text-amber-600 rounded focus:ring-amber-500">
              <label for="isPromo" class="text-xs font-semibold text-slate-700">Pasang Label "PROMO!"</label>
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-sm transition mt-2">
              Tambah Paket
            </button>
          </form>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3">Daftar Paket Aktif</h3>
          <div id="listPaket" class="space-y-3"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const BASE_URL = 'https://backend-adonat.vercel.app/api';
    
    // Konfigurasi Supabase Client-side (Buat Upload Langsung)
    const supabaseUrl = 'https://rseqeckdqabvcbnzdtak.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzZXFlY2tkcWFidmNibnpkdGFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzQ2NTAsImV4cCI6MjEwMzE1MDY1MH0.uRyYSp3pHvgjSLUs0_qOwrh03FeL0m1Q5PHZ4d-GJw0';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // ================= PENGATURAN UMUM =================
    async function loadPengaturan() {
      // Penawar Cache Bandel: ?t=...
      const res = await fetch(`${BASE_URL}/pengaturan?t=${Date.now()}`);
      const result = await res.json();
      if (result.sukses && result.data) {
        const wa = result.data.find(item => item.kunci === 'no_whatsapp');
        const info = result.data.find(item => item.kunci === 'info_pengiriman');
        if (wa) document.getElementById('noWa').value = wa.nilai;
        if (info) document.getElementById('teksPengiriman').value = info.nilai;
      }
    }

    document.getElementById('formWa').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(`${BASE_URL}/pengaturan`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kunci: 'no_whatsapp', nilai: document.getElementById('noWa').value }) });
      alert('Nomor WhatsApp tersimpan!');
    });

    document.getElementById('formPengiriman').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(`${BASE_URL}/pengaturan`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kunci: 'info_pengiriman', nilai: document.getElementById('teksPengiriman').value }) });
      alert('Info Pengiriman tersimpan!');
    });

    // ================= TOPPING & UPLOAD =================
    async function loadTopping() {
      // Penawar Cache Bandel: ?t=...
      const res = await fetch(`${BASE_URL}/topping?t=${Date.now()}`);
      const result = await res.json();
      const container = document.getElementById('listTopping');
      container.innerHTML = '';
      if (!result.data || result.data.length === 0) return container.innerHTML = '<p class="text-center text-xs text-slate-400 py-4">Belum ada topping.</p>';
      
      result.data.forEach(item => {
        container.innerHTML += `
          <div class="flex items-center justify-between py-3">
            <div class="flex items-center gap-3">
              <img src="${item.url_foto}" class="w-10 h-10 object-cover rounded-lg bg-slate-100">
              <p class="text-sm font-semibold">${item.ikon_emoji} ${item.nama}</p>
            </div>
            <button onclick="hapusTopping('${item.id}')" class="text-rose-600 hover:text-rose-800 text-xs font-semibold px-2">Hapus</button>
          </div>
        `;
      });
    }

    // FUNGSI SAKTI: UPLOAD FOTO -> DAPET LINK -> SIMPAN KE DATABASE
    document.getElementById('formTopping').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fileInput = document.getElementById('fileFoto');
      const file = fileInput.files[0];
      const loading = document.getElementById('loadingTopping');
      
      if (!file) return alert("Pilih foto dulu ya!");

      try {
        loading.classList.remove('hidden');

        // 1. Ubah nama file biar gak bentrok
        const namaFileUnik = Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9.]/g, '');
        
        // 2. Tembak file ke Supabase Storage
        const { data: uploadData, error: uploadError } = await _supabase.storage.from('foto-donat').upload(namaFileUnik, file);
        if (uploadError) throw new Error("Gagal upload foto ke brankas!");

        // 3. Minta link publik dari Supabase
        const { data: urlData } = _supabase.storage.from('foto-donat').getPublicUrl(namaFileUnik);
        const linkFotoUpload = urlData.publicUrl;

        // 4. Simpan ke Backend
        const payload = {
          nama: document.getElementById('namaTopping').value,
          ikon_emoji: document.getElementById('ikonEmoji').value,
          url_foto: linkFotoUpload
        };

        const responServer = await fetch(`${BASE_URL}/topping`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // JEBAKAN ERROR: Cek kalau database diam-diam nolak!
        const hasilServer = await responServer.json();
        if (!hasilServer.sukses) {
          throw new Error("Ditolak Database Supabase: " + hasilServer.error);
        }

        loading.classList.add('hidden');
        document.getElementById('formTopping').reset();
        loadTopping();
        alert('Mantap! Topping & Foto berhasil di-upload!');

      } catch (err) {
        loading.classList.add('hidden');
        alert("WADUH ERROR BOSKU: " + err.message); // Muncukin sumber masalahnya
      }
    });

    async function hapusTopping(id) {
      if (!confirm('Hapus topping ini?')) return;
      await fetch(`${BASE_URL}/topping/${id}`, { method: 'DELETE' });
      loadTopping();
    }

    // ================= PAKET =================
    async function loadPaket() {
      // Penawar Cache Bandel: ?t=...
      const res = await fetch(`${BASE_URL}/paket?t=${Date.now()}`);
      const result = await res.json();
      const container = document.getElementById('listPaket');
      container.innerHTML = '';
      if (!result.data || result.data.length === 0) return container.innerHTML = '<p class="text-center text-xs text-slate-400 py-4">Belum ada paket.</p>';
      
      result.data.forEach(item => {
        container.innerHTML += `
          <div class="p-3 border border-slate-200 rounded-xl flex items-start justify-between gap-3">
            <div>
              <h4 class="text-sm font-bold">${item.nama_paket} ${item.is_promo ? '<span class="text-rose-500 text-[10px]">PROMO</span>' : ''}</h4>
              <p class="text-xs text-slate-500 mt-1">${item.deskripsi}</p>
            </div>
            <button onclick="hapusPaket('${item.id}')" class="text-rose-600 text-xs font-semibold">Hapus</button>
          </div>
        `;
      });
    }

    document.getElementById('formPaket').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        nama_paket: document.getElementById('namaPaket').value,
        deskripsi: document.getElementById('deskripsiPaket').value,
        harga: parseInt(document.getElementById('hargaPaket').value),
        jumlah_pcs: document.getElementById('pcsPaket').value,
        is_promo: document.getElementById('isPromo').checked
      };
      
      const responServer = await fetch(`${BASE_URL}/paket`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const hasilServer = await responServer.json();
      
      // Jebakan error untuk form Paket
      if (!hasilServer.sukses) {
         return alert("Error simpan paket: " + hasilServer.error);
      }

      document.getElementById('formPaket').reset();
      loadPaket();
    });

    async function hapusPaket(id) {
      if (!confirm('Hapus paket ini?')) return;
      await fetch(`${BASE_URL}/paket/${id}`, { method: 'DELETE' });
      loadPaket();
    }

    loadPengaturan(); loadTopping(); loadPaket();
  </script>
</body>
</html>
